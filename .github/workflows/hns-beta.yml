name: Heart and Soul native gameplay beta
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hns-beta.yml'
      - 'core/hns_beta.py'
      - 'core/live.py'
      - 'core/live_runner.c'
      - 'profiles/heart-and-soul/**'
permissions:
  contents: read
concurrency:
  group: hns-beta-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-hns:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned upstream source
        uses: actions/checkout@v4
        with:
          repository: PokemonHnS-Development/pokehns-expansion
          ref: 167aa6d537b109bb229c231ddce4616974c4da71
          path: upstream-hns
          persist-credentials: false
      - name: Install native and upstream build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libmgba-dev gcc binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev
      - name: Build actual Heart and Soul v2.0.6
        working-directory: upstream-hns
        env:
          GAME_VERSION: HNS
          COMPARE: 0
        run: |
          make hns -j2 -O
          test -s pokehns.gba
          test -s pokehns.elf
      - name: Build native controller
        run: |
          mkdir -p build
          cc -std=gnu11 -O2 -Wall -Wextra core/live_runner.c -o build/live_runner -lmgba
      - name: Execute source-symbol-aware gameplay beta
        run: |
          python3 -m core.hns_beta --runner build/live_runner --rom upstream-hns/pokehns.gba --elf upstream-hns/pokehns.elf --out evidence/hns-beta.json
      - name: Retain symbolic milestone summary only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hns-beta-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/hns-beta.json
          if-no-files-found: warn
          retention-days: 7
