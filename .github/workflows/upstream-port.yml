name: Upstream gameplay port
on:
  push:
    branches: [development/upstream-gameplay-ports]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  upstream:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run all host and upstream tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
