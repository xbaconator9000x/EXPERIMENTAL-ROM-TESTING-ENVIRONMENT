name: Native GBA regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libmgba-dev gcc
      - name: Run synthetic emulator and navigation tests
        run: bash scripts/test.sh
      - name: Upload synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
