name: Native GBA regression
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest discover -s tests -v
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: sudo apt-get -o Acquire::Retries=3 update -qq && sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libmgba-dev gcc clang lld
      - name: Run synthetic emulator and navigation tests
        run: bash scripts/test.sh
      - name: Upload synthetic evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 7
